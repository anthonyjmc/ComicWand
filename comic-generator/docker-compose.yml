version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: comic_generator_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: comic_generator
      POSTGRES_USER: comic_user
      POSTGRES_PASSWORD: comic_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comic_user -d comic_generator"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: comic_generator_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: python:3.11-slim
    container_name: comic_generator_backend
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "pip install -r requirements.txt &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - ./backend/.env.example
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  celery_worker:
    image: python:3.11-slim
    container_name: comic_generator_celery_worker
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "pip install -r requirements.txt &&
      celery -A app.workers.celery_app.celery_app worker --loglevel=info"
    env_file:
      - ./backend/.env.example
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 20s
      timeout: 10s
      retries: 5

  flower:
    image: python:3.11-slim
    container_name: comic_generator_flower
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "pip install -r requirements.txt &&
      celery -A app.workers.celery_app.celery_app flower --port=5555"
    env_file:
      - ./backend/.env.example
    volumes:
      - ./backend:/app
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5555')\""]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
